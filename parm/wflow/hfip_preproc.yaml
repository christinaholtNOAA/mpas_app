
workflow:
  entities:
    WORKDIR_PREPROC: "{{ user.experiment_dir }}/@Y@m@d@H/work_prep"
  tasks:
    metatask_download:
      var:
        datum: gfs_0p25 gfs_atm gfs_sfc hfsa_grib storm_messages
      task_download_#datum#:
        attrs:
          maxtries: 10
        command: "{{ user.mpas_app }}/scripts/download_#datum#.sh"
        walltime: 00:10:00
        cores: 1
        partition: "{{ platform.service_partition }}"
        join:
          cyclestr:
            value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
        account: "{{ platform.account }}"
        envars: &envvars
          ATIME:
            cyclestr:
              value: "@Y-@m-@d_@H:00:00"
          OUTDIR:
            cyclestr:
              value: "{{ user.experiment_dir }}/@Y@m@d@H/downloaded_data"
          LOGDIR:
            cyclestr:
              value: "{{ user.experiment_dir }}/@Y@m@d@H/preproc_log"
          WORKDIR:
            cyclestr:
              value: "&WORKDIR_PREPROC;"
          INSTALLDIR: "{{ user.mpas_app }}"
        dependency:
          timedep:
            cyclestr:
              attrs:
                offset: "4:45:00"
              value: "@Y@m@d@H@M@S"
    task_run_upp_hfip_pre:
      attrs:
        maxtries: 3
      command:
        cyclestr:
          value: 'source &MPAS_APP;/load_wflow_modules.sh &PLATFORM; && &MPAS_APP;/scripts/upp.py
              -c &EXPERIMENT_CONFIG;
              --cycle @Y-@m-@dT@H:@M:@S
              --leadtime 0
              --key-path hfip_preproc'
      walltime: 00:10:00
      nodes: "{{ hfip_preproc.upp.execution.batchargs.nodes }}:ppn={{ hfip_preproc.upp.execution.batchargs.tasks_per_node }}"
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      dependency:
        and:
          taskdep_atm:
            attrs:
              task: download_gfs_atm
          taskdep_sfc:
            attrs:
              task: download_gfs_sfc
    task_wgrib2:
      attrs:
        maxtries: 3
      command: "{{ user.mpas_app }}/scripts/run_wgrib2.sh"
      walltime: 00:10:00
      nodes: "1:ppn=192"
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      envars:
        <<: *envvars
      dependency:
        and:
          taskdep_upp:
            attrs:
              task: run_upp_hfip_pre
          taskdep_gfs_0p25:
            attrs:
              task: download_gfs_0p25
          taskdep_hfsa_grib:
            attrs:
              task: download_hfsa_grib
    task_choose_storm:
      attrs:
        maxtries: 3
      command: "{{ user.mpas_app }}/scripts/choose_storm_wrapper.sh"
      walltime: 00:05:00
      cores: 1
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      envars:
        <<: *envvars
      dependency:
        and:
          taskdep_wgrib2:
            attrs:
              task: wgrib2
          taskdep_storm_messages:
            attrs:
              task: download_storm_messages
    task_scrub_work:
      attrs:
        maxtries: 3
      command:
        cyclestr:
          value: "set -xue && rm -r &WORKDIR_PREPROC;/*.grib2 && echo normal completion"
      walltime: 00:05:00
      cores: 1
      partition: "{{ platform.service_partition }}"
      account: "{{ platform.account }}"
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      dependency:
        and:
          taskdep_wgrib2:
            attrs:
              task: wgrib2
          taskdep_choose_storm:
            attrs:
              task: choose_storm
