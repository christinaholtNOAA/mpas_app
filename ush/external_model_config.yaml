
GFS:
  ics:
    prepare_grib_ics: &prepare_grib_gfs
      ungrib:
        vtable: "{{ user.mpas_app }}/parm/ungrib/Vtable.GFS"
    create_ics: &init_gfs
      mpas_init:
        namelist:
          update_values:
            dimensions:
              config_nfglevels: 57
              config_nfgsoillevels: 4
  lbcs:
    prepare_grib_lbcs:
      <<: *prepare_grib_gfs
    create_lbcs:
      <<: *init_gfs


RAP:
  ics:
    prepare_grib_ics:
      ungrib: &ungrib_rap
        gribfiles:
          - '{{ get_lbcs_data.rundir }}/rap.t{{ cycle.strftime("%H") }}z.wrfnatf00.grib2'
        vtable: "{{ user.mpas_app }}/parm/ungrib/Vtable.raphrrr"
    create_ics: &init_rap
      mpas_init:
        namelist:
          update_values:
            dimensions:
              config_nfglevels: 51
              config_nfgsoillevels: 9
  lbcs:
    prepare_grib_lbcs:
      ungrib:
        vtable: "{{ user.mpas_app }}/parm/ungrib/Vtable.raphrrr"
        gribfiles: !list "[{% for fhr in range(0, forecast.mpas.length + 1, user.lbcs.interval_hours) %}{{ get_lbcs_data.rundir }}/rap.t{{ cycle.strftime('%H') }}z.wrfnatf{{ '%02d' % fhr }}.grib2,{% endfor %}]"
    create_lbcs:
      <<: *init_rap

RRFS:
  ics:
    workflow:
      tasks:
        task_get_ics_data:
          memory: 30G
    prepare_grib_ics:
      ungrib: &ungrib_rrfs
        execution:
          batchargs:
            walltime: 00:30:00
            memory: 30G
        gribfiles:
          - '{{ get_lbcs_data.rundir }}/rrfs.t{{ cycle.strftime("%H") }}z.natlev.3km.f000.na.grib2'
        vtable: "{{ user.mpas_app }}/parm/ungrib/Vtable.RRFS"
      wgrib2: &wgrib2_rrfs
        budget_fields: '{{ data.mesh_files }}/budget_fields.txt'
        neighbor_fields: '{{ data.mesh_files }}/neighbor_fields.txt'
        grid_specs: "lambert:266:25.000000 234.862000:2000:3000.000000 18.281000:1450:3000.000000"
        grid_vectors: "UGRD:VGRD:USTM:VSTM:VUCSH:VVCSH"
    create_ics: &init_rrfs
      mpas_init:
        namelist:
          update_values:
            dimensions:
              config_nfglevels: 66
              config_nfgsoillevels: 9
        files_to_link:
          shdmax.{{ user.mesh_label }}.nc: "{{ platform.hrrr_fix }}/shdmax.{{ user.mesh_label }}.nc"
          shdmin.{{ user.mesh_label }}.nc: "{{ platform.hrrr_fix }}/shdmin.{{ user.mesh_label }}.nc"
  lbcs:
    workflow:
      tasks:
        task_get_lbcs_data:
          memory: 30G
    prepare_grib_lbcs:
      ungrib:
        <<: *ungrib_rrfs
        gribfiles: !list '[{% for fhr in range(0, forecast.mpas.length + 1, user.lbcs.interval_hours) %}{{ get_lbcs_data.rundir }}/rrfs.t{{ cycle.strftime("%H") }}z.natlev.3km.f{{ "%03d" % fhr }}.na.grib2,{% endfor %}]'
      wgrib2:
        <<: *wgrib2_rrfs
    create_lbcs:
      <<: *init_rrfs
