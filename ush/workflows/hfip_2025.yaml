user:
  driver_validation_blocks:
    - prepare_grib_ics.ungrib
    - create_ics.mpas_init
    - forecast.mpas
  mesh_label: x5.8060930
  workflow_blocks:
    - cold_start.yaml
    - post.yaml
    - graphics.yaml

workflow:
  tasks:
    task_get_lbcs_data: !remove
    task_ungrib_lbcs: !remove
    task_mpas_lbcs: !remove
      #    task_ungrib_ics:
      #      dependency:
      #        taskdep: !remove
      #        taskdep_choose_storm:
      #          attrs:
      #            task: choose_storm
    task_mpas:
      dependency:
        taskdep:
          attrs:
            task: mpas_ics
    metatask_post:
      task_combine_grib_#fhr#:
        command:
          cyclestr:
            value: 'cd {{ user.experiment_dir }}/@Y@m@d@H/upp/#fhr# && FHR=$( printf "%02d" "$((10##fhr#))") && cat PRSLEV.GrbF$FHR NATLEV.GrbF$FHR 2DFLD.GrbF$FHR >> ../COMBINED.GrbF$FHR'

hfip_preproc:
  upp:
    # upp settings follow UW Tools driver YAML
    control_file: "{{ user.mpas_app }}/parm/upp/postxconfig-NT-minimal.txt"
    execution:
      batchargs:
        walltime: 00:10:00
        nodes: 1
        tasks_per_node: 192
      envcmds:
        - ulimit -s unlimited || true
        - module use {{ user.mpas_app }}/src/UPP/modulefiles
        - module load {{ user.platform }}_intel
      executable: "{{ user.mpas_app }}/exec/upp.x"
      mpicmd: srun
    files_to_copy:
      postxconfig-NT.txt: "{{ hfip_preproc.upp.control_file }}"
    files_to_link:
      eta_micro_lookup.dat: "{{ user.mpas_app }}/parm/upp/nam_micro_lookup.dat"
      params_grib2_tbl_new: "{{ user.mpas_app }}/src/UPP/parm/params_grib2_tbl_new"
    namelist:
      update_values:
        model_inputs:
          filename: "{{ user.experiment_dir }}/{{ cycle.strftime('%Y%m%d%H') }}/downloaded_data/gfs.t{{ cycle.strftime('%H') }}z.atmf000.nc"
          ioform: netcdf
          grib: grib2
          datestr: "{{ (cycle + leadtime).strftime('%Y-%m-%d_%H:%M:%S') }}"
          modelname: GFS
          filenameflux: "{{ hfip_preproc.upp.namelist.update_values.model_inputs.filename }}"
          filenameflat: "{{ hfip_preproc.upp.files_to_copy['postxconfig-NT.txt'] }}"
        nampgb:
          kpo: 57
          numx: 2
          rdaod: true
          po: [1000.,975.,950.,925.,900.,875.,850.,825.,800.,775.,750.,725.,700.,675.,650.,625.,600.,575.,550.,525.,500.,475.,450.,425.,400.,375.,350.,325.,300.,275.,250.,225.,200.,175.,150.,125.,100.,70.,50.,40.,30.,20.,15.,10.,7.,5.,3.,2.,1.,0.7,0.4,0.2,0.1,0.07,0.04,0.02,0.01]
    rundir: '{{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/preproc_upp/{{ "%03d" % (leadtime.total_seconds() / 3600) }}'

      #prepare_grib_ics:
      #  ungrib:
      #    gribfiles:
      #      path: '{{ user.experiment_dir }}/{{ cycle.strftime("%Y%m%d%H") }}/downloaded_data/merged-by-field'
create_ics:
  mpas_init: &mpas_init
    files_to_copy:
      QNWFA_QNIFA_SIGMA_MONTHLY.dat: "{{ platform.hrrr_fix }}/../QNWFA_QNIFA_SIGMA_MONTHLY.dat"
      stream_list.atmosphere.diag_ugwp: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.diag_ugwp"
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.surface"
    files_to_link:
      "{{ user.mesh_label }}.ugwp_oro_data.nc": "{{ platform.hrrr_fix }}/{{ user.mesh_label }}.ugwp_oro_data.nc" 
    namelist:
      update_values:
        data_sources:
          config_soilcat_data: STASGO
          config_use_spechumd: true
          config_lu_supersample_factor: !remove
        interpolation_control:
          config_extrap_airtemp: linear
        dimensions:
          config_nvertlevels: 79
          config_nfglevels: 34
          config_nsoillevels: 4
          config_nvegopt: 1
        vertical_grid:
          config_ztop: 38000.
          config_specified_zeta_levels: "{{ user.mpas_app }}/parm/mpas//L80_hfip.txt"
          config_blend_bdy_terrain: false
        preproc_stages:
          config_aerosol_climo: true

forecast:
  mpas:
    domain: global
    length: 120
    files_to_copy:
      stream_list.atmosphere.diag_ugwp: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.diag_ugwp"
      stream_list.atmosphere.diagnostics: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.diagnostics"
      stream_list.atmosphere.output: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.output"
      stream_list.atmosphere.surface: "{{ user.mpas_app }}/parm/mpas/hfip_2025/stream_list.atmosphere.surface"
    files_to_link:
      CCN_ACTIVATE.BIN: !remove
      "{{ user.mesh_label }}.ugwp_oro_data.nc": "{{ platform.hrrr_fix }}/{{ user.mesh_label }}.ugwp_oro_data.nc" 
      "NoahmpTable.TBL": "{{ user.mpas_app }}/src/MPAS-Model/NoahmpTable.TBL"
    namelist:
      update_values:
        nhyd_model:
          config_dt: 24.
          config_number_of_sub_steps: 6
          config_apvm_upwinding: 0
        damping:
          config_zd: 33000.0
          config_mpas_cam_coef: 2.
          config_number_cam_damping_levels: 7
          config_rayleigh_damp_u: true
          config_rayleigh_damp_u_timescale_days: 2.5
        io:
          config_pio_num_iotasks: 64
          config_pio_stride: 125
        limited_area:
          config_apply_lbcs: false
        physics:
          config_frac_seaice: true
          config_radtlw_interval: 00:15:00
          config_radtsw_interval: 00:15:00
          config_gvf_update: true
          config_convection_scheme: cu_grell_freitas
          config_tempo_ml_nc_pbl: true
          config_lsm_scheme: sf_noahmp
          num_soil_layers: 4
          config_gfl_sub3d: 1
        physics_lsm_noahmp:
          config_noahmp_iopt_crs: 2
          config_noahmp_iopt_stc: 3
    streams:
      ugwp_oro_data_in:
        filename_template: "{{ user.mesh_label }}.ugwp_oro_data.nc"
        input_interval: initial_only
        type: input
        mutable: false
        io_type: "pnetcdf,cdf5"
        packages: ugwp_orog_stream
      diag_ugwp:
        type: output
        mutable: true
        filename_template: "{{ user.mesh_label }}.diag_ugwp.$Y-$M-$D_$h.$m.$s.nc"
        io_type: "pnetcdf,cdf5"
        clobber_node: replace_files
        packages: ugwp_diags_stream
        output_interval: 06:00:00
        files:
          - stream_list.atmosphere.diag_ugwp
      surface: !remove
      lbc_in: !remove

post:
  mpassit:
    nmldir: '{{ user.mpas_app }}/parm/mpassit/hfip_2025'
    parmdir: '{{ user.mpas_app }}/parm/mpassit/hfip_2025'
  upp:
    control_file: "{{ user.mpas_app }}/parm/upp/postxconfig-NT-hfip_mpas.txt"
    files_to_copy:
      postxconfig-NT.txt: "{{ user.mpas_app }}/parm/upp/postxconfig-NT-hfip_mpas.txt"
graphics:
  execution:
    batchargs:
      tasks_per_node: 192
      nodes: 1
  config:
    identifier: HFIP Experimental
    image_list: "{{ user.mpas_app }}/parm/pygraf/hfip_subset.yml"
    specs_file: "{{ user.mpas_app }}/parm/pygraf/hfip_specs.yml"

