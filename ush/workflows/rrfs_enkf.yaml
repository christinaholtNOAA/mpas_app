      attrs:
        cycledefs: prod
        maxtries: 3
      account: "{{ common.account }}"
      command: "{{ common.launch }} JRRFS_CLEAN"
      jobname:
        cyclestr:
          value: "{{ common.tag }}_clean_c@H"
      join:
        cyclestr:
          value: "{{ common.logdir }}_clean_{{ common.tag }}_@Y@m@d@H.log"
      nodes: "1:ppn=1"
      partition: "{{ common.partition }}"
      queue: "{{ common.queue_default }}"
      walltime: "00:50:00"
      deadline:
        cyclestr:
          attrs:
            offset: "24:00:00"
          value: "@Y@m@d@H@M"
      envars:
        <<: *common_envars
        CLEAN_MODE: "1"
        CHECK_IS_CYC_DONE: "FALSE"
        STMP_RETENTION_CYCS: "18"
        COM_RETENTION_CYCS: "{\"default\": 48, \"lbc,fcst\": 36}"
        LOG_RETENTION_CYCS: "840"
        CLEAN_BACK_DAYS: "2"
        STMP_KEPT_TASKS: ""
      dependency:
        and:
          taskdep_prep_ic:
            attrs:
              task: prep_ic
